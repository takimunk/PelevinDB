version: 2.1
jobs:
  checks:
    docker:
      - image: cimg/node:22.22-browsers
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths: [~/.npm]
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - store_artifacts:
          path: test-results
  build-and-deploy:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    parameters:
      target:
        type: enum
        enum: [preview, production]
    steps:
      - checkout
      - run:
          name: Install Node 22
          command: |
            source "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm alias default 22
            echo 'source "$NVM_DIR/nvm.sh"; nvm use 22' >> "$BASH_ENV"
      - run:
          name: Build, publish and verify Coolify deployment
          command: node scripts/circleci-deploy.ts << parameters.target >>
          no_output_timeout: 20m
workflows:
  xbook:
    jobs:
      - checks
      - build-and-deploy:
          name: deploy-preview
          target: preview
          requires: [checks]
          serial-group: << pipeline.project.slug >>/preview
          filters:
            branches:
              only: /^codex\/.*/
      - build-and-deploy:
          name: deploy-production
          target: production
          requires: [checks]
          serial-group: << pipeline.project.slug >>/production
          filters:
            branches:
              only: main
