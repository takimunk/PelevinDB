<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta
      name="description"
      content="PelevinDB is a computational reading of Viktor Pelevin's complete works: every page read by a language model, his books mapped by meaning, and essays on what the numbers show."
    />
    <title>PelevinDB — Pelevin, page by page</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Set the theme and language before first paint so there is no flash; src/i18n keeps them in sync afterwards.
      (function () {
        var d = document.documentElement,
          t = null,
          l = null;
        try {
          t = localStorage.getItem("pelevindb.theme");
          l = localStorage.getItem("pelevindb.lang");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.dataset.theme = t;
        d.style.colorScheme = t;
        if (l !== "en" && l !== "ru") l = /^ru\b/i.test(navigator.language || "") ? "ru" : "en";
        d.lang = l;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#0f0f0e" : "#f6f4ef");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
