name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: xbook-preview-build
          path: dist
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xbook:check .
      - name: Verify production container
        run: |
          docker run -d --name xbook-check -p 127.0.0.1:5173:5173 xbook:check
          trap 'docker logs xbook-check; docker rm -f xbook-check' EXIT
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:5173/api/health
          curl --fail http://127.0.0.1:5173/ > /dev/null
  deploy:
    needs: [check, container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.COOLIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://xbookx.xyz
    steps:
      - name: Request Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$COOLIFY_WEBHOOK" || { echo 'COOLIFY_WEBHOOK is missing'; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo 'COOLIFY_TOKEN is missing'; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
